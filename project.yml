name: Bandal
options:
  bundleIdPrefix: app.bandal
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.2"
packages:
  BandalCore:
    path: Packages/BandalCore
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "7"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: VUZ7Z98BW3
    CODE_SIGN_STYLE: Automatic
targets:
  Bandal:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources, Info.plist]
      - path: Shared
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
      - path: App/Resources/Configuration.plist
        optional: true
        buildPhase: resources
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Localization
        buildPhase: resources
      - path: App/Resources/Brand
        type: folder
      - path: App/Resources/DesktopNative
        type: folder
        buildPhase: resources
      - path: App/Resources/Dictionary
        type: folder
        buildPhase: resources
    dependencies:
      - target: BandalShare
        embed: true
      - package: BandalCore
      - package: SwiftMath
      - package: sherpa-onnx
        product: sherpa-onnx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bandal.ipad
        CODE_SIGN_ENTITLEMENTS: App/Bandal.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [BandalTests, BandalUITests]
  BandalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: [Info.plist, BandalShare.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bandal.ipad.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/BandalShare.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "2"
  BandalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/BandalTests]
    dependencies:
      - target: Bandal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.bandal.ipad.tests
        TARGETED_DEVICE_FAMILY: "2"
  BandalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/BandalUITests]
    dependencies:
      - target: Bandal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.bandal.ipad.uitests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_OBJC_BRIDGING_HEADER: Tests/BandalUITests/BandalUITests-Bridging-Header.h
